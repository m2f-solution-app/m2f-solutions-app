<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de M2F Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--panel:#15171c;--panel2:#1b1e25;--border:#262a33;--text:#f2f3f5;--dim:#9aa0ab;--accent:#ff7a30;--accent-dim:#c95a1f;--tagc:#ff7a30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px 16px 48px}
.wrap{max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#1a0d02;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;letter-spacing:-.3px}
.brand b{font-size:17px}.brand b span{color:var(--accent)}
h1{font-size:28px;line-height:1.15;margin:0 0 8px;font-weight:700;letter-spacing:-.4px}
.sub{color:var(--dim);font-size:14px;line-height:1.45;margin:0 0 20px}
.search{position:relative;margin-bottom:18px}
.search input{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:13px 14px 13px 42px;font:inherit;font-size:16px;outline:none}
.search input:focus{border-color:var(--accent)}
.search i{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-style:normal;opacity:.6}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--dim);font-weight:600;margin:0 0 8px}
.seg{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--dim);font:inherit;font-size:14px;font-weight:600;padding:10px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--border)}
hr{border:0;border-top:1px solid var(--border);margin:20px 0}
.tabs{display:flex;gap:18px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font:inherit;font-size:14px;font-weight:600;padding:8px 0 10px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
h2{font-size:20px;margin:0 0 4px}
.intro{color:var(--dim);font-size:13.5px;margin:0 0 18px;line-height:1.45}
.list{position:relative}
.step{display:flex;gap:12px;position:relative;padding-bottom:10px}
.rail{flex:none;width:30px;display:flex;flex-direction:column;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--bg);flex:none;margin-top:10px}
.step.open .dot{background:var(--accent);color:#1a0d02}
.line{flex:1;width:2px;background:var(--border);margin-top:4px;min-height:10px}
.step:last-child .line{display:none}
.card{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.step.open .card{border-color:rgba(255,122,48,.45)}
.head{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--text);font:inherit;text-align:left;padding:12px 14px;cursor:pointer}
.head .t{flex:1;min-width:0}
.head b{display:block;font-size:15px;line-height:1.3}
.head small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;line-height:1.35}
.step.open .head small{display:none}
.chev{color:var(--dim);transition:transform .2s;flex:none}
.step.open .chev{transform:rotate(180deg);color:var(--accent)}
.body{display:none;padding:0 14px 14px}
.step.open .body{display:block}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font-size:11.5px;font-weight:600;color:var(--dim);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px 10px}
.chip.w{color:#ffb98a;border-color:rgba(255,122,48,.35)}
.sec{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.sec:last-child{margin-bottom:0}
.sec h4{margin:0 0 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tagc)}
.sec p{margin:0;font-size:14px;line-height:1.5}
.sec ol{margin:0;padding-left:20px}.sec li{font-size:14px;line-height:1.5;margin-bottom:3px}
.tip{font-size:13px;line-height:1.45;background:rgba(255,122,48,.09);border:1px solid rgba(255,122,48,.3);border-radius:10px;padding:9px 12px;margin-top:8px}
.vacio{color:var(--dim);font-size:14px;padding:20px 0;text-align:center}
.res-where{font-size:11px;color:var(--dim);margin-top:3px}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:28px}
</style></head><body>
<div class="wrap">
  <div class="brand"><div class="logo">M2F</div><b>M2F <span>Solutions</span></b></div>

  <div class="search"><i>🔍</i><input id="q" type="search" placeholder="Buscar: turno, cuota, rutina…" autocomplete="off"></div>
  <div id="quien">
    <div class="lbl">¿QUIÉN SOS?</div>
    <div class="seg" id="seg"></div>
    <hr>
  </div>
  <div class="tabs" id="tabs"></div>

  <p class="intro" id="intro"></p>
  <div class="list" id="list"></div>
  <footer>Actualizado a la versión 85 · 30/9/2026</footer>
</div>

const ROLES = [['guias','Inicio'],['admin','Admin'],['recepcion','Recepción'],['alumno','Alumno']];
let role='guias', sub='arranque', open=null, query='';
const $=id=>document.getElementById(id);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const plain=s=>String(s||'').replace(/<[^>]+>/g,'');

function short(it){ // bajada de una línea para el título cerrado
  const t=plain(it.sirve); const i=t.search(/[.:]\s/); let s=i>20&&i<110?t.slice(0,i):t.slice(0,80).replace(/\s+\S*$/,'')+'…';
  return s.replace(/\.$/,'');
}
function items(){
  if(query){const q=norm(query),out=[];
    Object.keys(DATA).forEach(r=>Object.keys(DATA[r].subs).forEach(s=>DATA[r].subs[s].items.forEach((it,i)=>{
      if(norm([it.title,it.sirve,it.aplica,it.donde,(it.pasos||[]).join(' ')].join(' ')).includes(q)) out.push({it,key:r+'/'+s+'/'+i,where:DATA[r].label.replace(/^\S+\s/,'')+' · '+DATA[r].subs[s].label.replace(/^\S+\s/,'')});
    })));return out;}
  return DATA[role].subs[sub].items.map((it,i)=>({it,key:role+'/'+sub+'/'+i}));
}
function render(){
  $('quien').style.display=$('tabs').style.display=query?'none':'';
  $('seg').innerHTML=ROLES.map(([k,l])=>`<button class="${k===role?'on':''}" data-r="${k}">${l}</button>`).join('');
  const subs=DATA[role].subs, keys=Object.keys(subs);
  $('tabs').innerHTML=keys.map(k=>`<button class="${k===sub?'on':''}" data-s="${k}">${subs[k].label.replace(/^\S+\s/,'')}</button>`).join('');
  const L=items();
  if(query){ $('h').textContent=L.length+(L.length===1?' resultado':' resultados'); $('intro').textContent='En toda la guía.'; }
  else { $('h').textContent=subs[sub].label.replace(/^\S+\s/,''); $('intro').textContent=subs[sub].intro||''; }
  $('intro').style.display=$('intro').textContent?'':'none';
  const numerada = !query && role==='guias' && sub==='arranque';
  $('list').innerHTML=L.length?L.map((e,n)=>{
    const it=e.it, isOpen=e.key===open;
    let b='';
    if(it.donde||it.quien) b+='<div class="meta">'+(it.donde?`<span class="chip">📍 ${it.donde}</span>`:'')+(it.quien?`<span class="chip w">👥 ${it.quien}</span>`:'')+'</div>';
    b+=`<div class="sec"><h4>Para qué sirve</h4><p>${it.sirve}</p></div>`;
    if(it.pasos&&it.pasos.length) b+=`<div class="sec"><h4>Cómo se usa</h4><ol>${it.pasos.map(p=>'<li>'+p+'</li>').join('')}</ol></div>`;
    b+=`<div class="sec"><h4>Dónde impacta</h4><p>${it.aplica}</p></div>`;
    if(it.tip) b+=`<div class="tip">💡 ${it.tip}</div>`;
    return `<div class="step ${isOpen?'open':''}"><div class="rail"><div class="dot">${numerada?n+1:it.icon}</div><div class="line"></div></div>
      <div class="card"><button class="head" data-k="${e.key}"><span class="t"><b>${it.title}</b><small>${short(it)}</small>${e.where?`<div class="res-where">${e.where}</div>`:''}</span><span class="chev">⌄</span></button><div class="body">${b}</div></div></div>`;
  }).join(''):'<div class="vacio">No encontré nada. Probá con otra palabra.</div>';
}
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-r]'),s=e.target.closest('[data-s]'),k=e.target.closest('[data-k]');
